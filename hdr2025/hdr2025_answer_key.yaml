- id: h10
  category: contradiction
  key_points:
  - States the Foreword's claim that decades of human development progress,
    reflected in the HDI, have flatlined with no clear recovery from the
    Covid-19 pandemic and subsequent crises
  - States the Overview's claim that the global HDI value is projected to
    reach a record high in 2024
  - Reconciles the two by noting the 2024 increase, while a record high,
    would be the lowest since records began 35 years ago
  - Notes the report quantifies this slowdown as a mean 2021-2024 change in
    HDI value about 4.5 times lower than the 1990-2024 mean change
  forbidden:
  - Treats the two statements as an unresolved inconsistency rather than
    explaining the reconciliation
  - Claims the global HDI actually declined in 2024
  - States a specific numeric 2024 global HDI value (e.g. "0.765") as if
    explicitly given in prose; the source states only that a record high was
    reached without stating its value as text (0.765 appears only as an axis
    gridline in figure O.2, not as a reported data point)
- id: h11
  category: contradiction
  key_points:
  - States that AI use is already substantial for about one fifth (about 20
    percent) of respondents
  - States that about two-thirds of respondents in low, medium and high HDI
    countries expect to use AI in education, health and work within one year
  - Explains the two are not contradictory because one describes current use
    and the other describes expected use one year out
  - References figure O.1's actual-use figures (14.4% low/medium HDI, 23.6%
    high HDI, 19.0% very high HDI) versus expected one-year use figures
    (66.1%, 68.9%, 45.9% respectively)
  forbidden:
  - Treats both statistics as describing the same time period
  - Claims the "two-thirds" figure describes current/past-month use rather
    than one-year expected use
  - Swaps or inverts the figure O.1 percentages between HDI groups
- id: h12
  category: contradiction
  key_points:
  - States that AI extends automation to some nonroutine tasks, beyond the
    routine/nonroutine dichotomy useful in the classical programming era
    (figure 1.7)
  - States that many technically automatable tasks still require human
    presence or evaluation, especially high-stakes tasks such as clinical
    or legal decisions
  - "Explains the report's reconciling framework: automation is favoured for
    low-stakes tasks; human evaluation is required where AI errors carry high
    stakes; human-AI complementarity is favoured where AI augments rather
    than replaces human judgment"
  forbidden:
  - Claims the report treats automation and human evaluation as flatly
    contradictory with no reconciling framework
  - Claims stakes or the range of potential implications play no role in
    when the report favours automation versus human evaluation
- id: h13
  category: cross_section
  key_points:
  - Cites figure 1.8's finding that workers with lower skill and experience
    can benefit more from AI
  - Cites figure 6.2's finding that men and people with more education report
    higher AI use for work
  - "Identifies the resulting inequality risk: the workers positioned to
    benefit most from AI (lower-skilled, less-experienced) are not the ones
    who actually report using it most, since usage skews toward more
    educated, male workers"
  forbidden:
  - Claims the two figures show no tension or inequality risk
  - Claims figure 6.2 shows lower-skilled or less-educated workers reporting
    higher AI use (inverting its finding)
- id: h14
  category: cross_section
  key_points:
  - Cites figure 5.5's finding that most large-scale AI models are developed
    by organizations based in the United States, followed by China and the
    United Kingdom
  - Cites figure 5.8's finding that India has the highest self-reported AI
    skills penetration
  - "Identifies the distinction: AI production power is concentrated in a
    small set of countries (US, China, UK), while AI user/skills capability
    is not concentrated in those same countries"
  forbidden:
  - Claims India also leads in large-scale AI model production
  - Claims the United States, China, or the United Kingdom also lead in
    self-reported AI skills penetration
  - Conflates AI model production with AI skills penetration as the same
    measure
- id: h15
  category: cross_section
  key_points:
  - Cites chapter 4's finding that about 95.9 percent of the top million
    websites do not comply with the International Web Content Accessibility
    Guidelines
  - Cites chapter 4's finding that patents for assistive technology are
    concentrated in a handful of countries
  - Cites chapter 6's "universal and meaningful connectivity" framework
    (quality, availability, affordability, security, devices, skills)
  - Concludes connectivity alone is insufficient because it does not fix
    inaccessible design and content, underrepresentation in AI training data,
    or unequal access to assistive technology -- inclusion requires
    deliberate accessibility choices beyond mere connection
  forbidden:
  - Claims the report treats connectivity as sufficient on its own for
    inclusive AI
  - Gives a web accessibility non-compliance figure other than approximately
    95.9 percent
- id: h16
  category: global_synthesis
  key_points:
  - States the report frames human agency as central to human development,
    with AI's impact determined by human choices in design and deployment
    rather than by the technology itself
  - Traces chapter 2's framing of AI shifting "from tools to agents" and "from
    doing what we do to choosing what we choose"
  - Traces chapter 3's people-centred, life-stage view of AI use
  - Traces chapter 5's focus on concentrated power ("Power, influence and
    choice in the Algorithmic Age")
  - Traces chapter 6's proposal of a "complementarity economy" in which AI
    augments rather than replaces human work
  - Notes the recurring principle that decisions should be ceded to AI only
    when doing so expands human agency and freedoms
  forbidden:
  - Claims the report treats human agency as inevitably eroded by AI with no
    possibility of AI augmenting it
  - Treats the chapters as unconnected topics rather than a developing
    argument about agency
- id: h17
  category: global_synthesis
  key_points:
  - States the report explicitly names and challenges "techno-determinism,"
    the assumption that technology alone shapes social outcomes
  - States the report argues technology coevolves with, and is shaped by,
    economic, social and political systems and institutions
  - States human choice -- in design, deployment and governance -- is
    presented as the recurring determinant of whether AI advances or harms
    human development
  forbidden:
  - Claims the report endorses a techno-deterministic view of AI
  - Claims the report presents AI's outcomes as fixed or inevitable
    regardless of policy or institutional choices
- id: h18
  category: global_synthesis
  key_points:
  - States the report links inequalities across life stage, disability,
    gender, education/skills, connectivity and AI power concentration as
    mutually reinforcing rather than separate
  - Cites the AI supply chain concentration finding that about 92 percent of
    GPU revenue from data centres goes to NVIDIA as an example of
    concentrated AI power
  - Cites the web accessibility gap (about 95.9 percent of top websites
    non-compliant) as an example of a disability-linked inequality
  - States the report's recurring policy response combines expanding
    universal and meaningful connectivity, building inclusive and adaptive
    institutions and skills, and steering AI deployment through human choice
    and governance
  forbidden:
  - Claims the report treats these inequalities (life stage, disability,
    gender, education, connectivity, AI power) as unrelated to one another
  - Misattributes the 87 percent "AI applications" concentration figure --
    which the source ties specifically to ChatGPT -- as a general "Big Tech
    platforms" figure
  - Claims the report's policy response relies on a single lever (e.g.
    connectivity alone) rather than a combination of connectivity, skills
    and governance
