# Frozen answer key -- Human Development Report 2025 ("A Matter of Choice").
# Built per Protocol 2 against hdr2025.txt and hdr2025_fullscan_questions.json.
# Every key point and forbidden claim below was verified against the source
# text (Statistical Annex Table 1, Contents, and body chapters) before being
# written. Freeze this file and reuse it for all future scoring of this
# document; do not regenerate per scoring run.

