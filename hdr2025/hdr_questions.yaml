- category: contradiction
  id: h10
  question: The Foreword says that human development progress has flatlined with no clear recovery, while
    the Overview says the global HDI is projected to reach a record high in 2024. State both claims and
    explain how the report reconciles this apparent contradiction.
- category: contradiction
  id: h11
  question: The Overview describes current AI use as substantial for about one fifth of respondents, yet
    says roughly two thirds of respondents in low, medium and high HDI countries expect to use AI in education,
    health and work within one year. Why are these statements not contradictory, and what change is the
    report describing?
- category: contradiction
  id: h12
  question: Chapter 1 says that AI extends automation to some nonroutine tasks, but also argues that many
    technically automatable tasks still require human presence or evaluation. State the two positions
    and explain the conditions under which the report favours automation, human evaluation or human–AI
    complementarity.
- category: cross_section
  id: h13
  question: Figure 1.8 says workers with lower skill and experience can benefit more from AI, while Figure
    6.2 says men and people with more education report higher AI use for work. What inequality risk emerges
    when these two findings are considered together?
- category: cross_section
  id: h14
  question: Figure 5.5 says most large-scale AI models are developed by organizations in the United States,
    followed by China and the United Kingdom, while Figure 5.8 says India has the highest self-reported
    AI skills penetration. What distinction between AI production power and AI user capabilities does
    this comparison reveal?
- category: cross_section
  id: h15
  question: Chapter 4 reports major accessibility gaps for people with disabilities, including widespread
    failure to meet web accessibility guidelines. Chapter 6 promotes universal and meaningful connectivity.
    Taken together, why does the report imply that connectivity alone is insufficient for inclusive AI?
- category: global_synthesis
  id: h16
  question: Taking Chapters 1–6 together, how does the report develop the concept of human agency in relation
    to AI—from tasks and AI agents to life stages, social narratives, concentrated power and the complementarity
    economy?
- category: global_synthesis
  id: h17
  question: How does the report challenge techno-deterministic narratives about AI, and what recurring
    role does human choice play in its account of development outcomes?
- category: global_synthesis
  id: h18
  question: Across the report, how are inequalities linked across life stage, disability, gender, education,
    connectivity and the concentration of AI power? Summarize the report's recurring policy response.
