    and how many under TABLES? Include entries whose identifiers begin with S.
- category: aggregation
  id: h03
  question: According to the Contents' FIGURES list, how many figures belong to the Overview and to each
    of Chapters 1–6, including figures whose identifiers begin with S? Give the total and identify the
    section with the most figures.
